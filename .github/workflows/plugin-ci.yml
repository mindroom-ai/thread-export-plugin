name: Plugin compatibility

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: plugin-compatibility-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  compatibility:
    permissions:
      contents: read
    uses: mindroom-ai/mindroom/.github/workflows/plugin-ci.yml@a2a9d51ccee23a48a984fca914d9a6b1a299d566
    with:
      plugin_repository: ${{ github.repository }}
      plugin_ref: ${{ github.sha }}
      artifact_name: thread-export-plugin
      mindroom_ref: a2a9d51ccee23a48a984fca914d9a6b1a299d566
      require_tests: true
