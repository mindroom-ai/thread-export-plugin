name: Plugin compatibility

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: plugin-compatibility-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  compatibility:
    permissions:
      contents: read
    uses: mindroom-ai/mindroom/.github/workflows/plugin-ci.yml@2df3c64c0ba4a71cd7f45a27e54dd53d6452ef91 # v2026.8.130
    with:
      plugin_repository: ${{ github.repository }}
      plugin_ref: ${{ github.sha }}
      artifact_name: thread-export-plugin
      mindroom_ref: 2df3c64c0ba4a71cd7f45a27e54dd53d6452ef91 # v2026.8.130
      require_tests: true
