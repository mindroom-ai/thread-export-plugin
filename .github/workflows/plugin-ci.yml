name: Plugin compatibility

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: plugin-compatibility-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  compatibility:
    permissions:
      contents: read
    uses: mindroom-ai/mindroom/.github/workflows/plugin-ci.yml@ad90fccb6e0eb983a52255288c02a70abfb0135b
    with:
      plugin_repository: ${{ github.repository }}
      plugin_ref: ${{ github.sha }}
      artifact_name: thread-export-plugin
      mindroom_ref: ad90fccb6e0eb983a52255288c02a70abfb0135b
      require_tests: true
